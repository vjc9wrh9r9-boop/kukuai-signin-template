name: 库库AI 每日签到

on:
  schedule:
    # 每天 01:30 UTC = 北京时间 09:30
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kukuai-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Cookie secret
        id: ck
        env:
          KUKUAI_COOKIES: ${{ secrets.KUKUAI_COOKIES }}
        run: |
          if [ -n "$KUKUAI_COOKIES" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has=false" >> "$GITHUB_OUTPUT"
          {
            echo "## 还没配 Cookie，本次已跳过"
            echo ""
            echo "这个仓库是**模板**，直接点运行会停在这里 —— 这是正常状态，不是报错。"
            echo ""
            echo "### 三步配好"
            echo "1. 右上 **Use this template → Create a new repository**，可见性选 **Private**"
            echo "2. 新仓库里 **Settings → Secrets and variables → Actions → New repository secret**"
            echo "3. Name 填 \`KUKUAI_COOKIES\`，Secret 粘贴 GetCookie 工具里「② 复制已抓取的 Cookie」得到的内容"
            echo ""
            echo "配好后回到 **Actions → 库库AI 每日签到 → Run workflow**。以后每天 09:30（北京时间）自动跑。"
            echo ""
            echo "> Cookie 只存在仓库 secret 里，日志不会打印。必须 Private 仓库：运行记录会留在你的仓库里。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::未配置 KUKUAI_COOKIES，已跳过（模板仓库的正常状态，不是错误）"

      - uses: actions/setup-python@v5
        if: steps.ck.outputs.has == 'true'
        with:
          python-version: "3.12"

      - name: 安装 Playwright
        if: steps.ck.outputs.has == 'true'
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 签到
        if: steps.ck.outputs.has == 'true'
        env:
          KUKUAI_COOKIES: ${{ secrets.KUKUAI_COOKIES }}
        run: |
          mkdir -p "$HOME/.kukuai"
          printf '%s' "$KUKUAI_COOKIES" > "$HOME/.kukuai/cookies.json"
          set -o pipefail
          python kukuai_signin.py --cookies "$HOME/.kukuai/cookies.json" --out out | tee result.json

      - name: 写摘要
        if: always() && steps.ck.outputs.has == 'true' 
        run: |
          python - <<'PY'
          import json, os
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          try:
              d = json.load(open("result.json", encoding="utf-8"))
          except Exception:
              msg = "### 库库AI 每日签到\n\n没有拿到 result.json，脚本可能启动失败，见上方日志。\n"
              if path:
                  open(path, "a", encoding="utf-8").write(msg)
              raise SystemExit(0)
          status_map = {"signed": "✅ 刚签到成功", "already": "✅ 今天已经签过",
                        "unconfirmed": "⚠️ 没确认到签到结果", "probe": "🔍 只探测"}
          lines = ["### 库库AI 每日签到", ""]
          lines.append("- 结果：%s" % status_map.get(d.get("status"), d.get("status")))
          if d.get("error"):
              lines.append("- 错误：%s" % d["error"])
          if d.get("streak") is not None:
              lines.append("- 已连签：%s 天" % d["streak"])
          n = d.get("next_node")
          if n:
              lines.append("- 下一档：连签 %s 天（还差 %s 天，%s）" % (n["day"], n["need"], n["reward"]))
          if d.get("activity_days_left") is not None:
              lines.append("- 活动剩余：%s 天" % d["activity_days_left"])
          if path:
              open(path, "a", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

      - name: 上传截图
        if: always() && steps.ck.outputs.has == 'true' 
        uses: actions/upload-artifact@v4
        with:
          name: signin-${{ github.run_id }}
          path: out
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败开 issue
        if: failure() && steps.ck.outputs.has == 'true' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REASON=$(python -c "
          import json
          try:
              d = json.load(open('result.json', encoding='utf-8'))
              print(d.get('error') or d.get('stage') or 'unknown')
          except Exception:
              print('未产出 result.json，见运行日志')
          " 2>/dev/null | tr '\n' ' ' | tr -d '"' | cut -c1-80)
          [ -z "$REASON" ] && REASON="见运行日志"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "签到失败 $(date -u +%Y-%m-%d)" \
            --body "运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          原因：${REASON}

          处理：
          - 登录态失效 → 重新导出 BDUSS/STOKEN，更新 secret KUKUAI_COOKIES
          - 验证码/风控 → 云端 IP 被拦，改用境内机器或在 Settings 里换 runner
          " || true
